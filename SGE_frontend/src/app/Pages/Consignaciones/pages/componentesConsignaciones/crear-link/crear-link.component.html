<h1 class="titulo">Generar Link de Pago </h1><br>
<hr class="border-4">
<div class="row align-items-center">
  <div class="row align-items-center">
    <div class="col-md-12 col-12">
      <div class="usuario mt-4">
        <input name="numeroRecibo" type="text" class="input-usuario" placeholder="Número Del Recibo">
      </div>
    </div>
    <div class="col-md-6 col-12">
      <div class="usuario">
        <input name="valor" type="text" class="input-usuario" placeholder="Valor">
      </div>
    </div>
    <div class="col-md-6 col-12">
      <div class="usuario">
        <input name="fechaPago" type="date" class="input-usuario">
      </div>
    </div>
  </div>

  <div class="row align-items-end">
    <div class="col-md-12 col-12">
      <div class="usuario">
        <select name="idPlataforma" class="form-select" required aria-label="select example">
          <option value="0">Medio de Pago</option>
          <option value="1">Bancolombia </option>
          <option value="2">Nequi</option>
          <option value="3"></option>
        </select>
      </div>
    </div>
  </div>

  <div style="text-align: center;">
    <button class="guardar" type="button">Guardar Consignaciones</button>
  </div><br>
</div>
