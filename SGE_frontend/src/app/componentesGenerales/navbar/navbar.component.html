<div class="row d-md-block">
    <!-- Añadido mb-4 para margen inferior -->
    <!-- Navbar mejorado -->
    <nav class="navbar navbar-expand-lg nav-bar-custom shadow-sm border-bottom border-2 border-gray">
        <div class="container-fluid d-flex align-items-center justify-content-between py-2">
            <div class="d-flex align-items-center">
                <!-- Botón de menú -->
                <button class="btn btn-menu me-2 me-lg-3" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasWithBackdrop" aria-controls="offcanvasWithBackdrop"
                    aria-label="Abrir menú">
                    <i class="fas fa-bars fa-lg"></i>
                </button>

                <a routerLink="/opciones" class="d-none d-lg-block logo-link">
                    <img src="../../../assets/H_electro.svg" alt="Logo" class="logo-img"
                        style="height: 70px; width: auto" />
                </a>
            </div>

            <div class="d-flex align-items-center">
                <!-- Notificaciones con icono rojo vino -->
                <div class="dropdown notification-dropdown me-2 me-lg-3">
                    <a class="nav-link dropdown-toggle notification-btn p-2 rounded-circle" href="#" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-bell fa-lg position-relative notification-icon">
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill notification-badge">
                                3
                            </span>
                        </i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end notification-menu">
                        <li>
                            <h6 class="dropdown-header notification-header">
                                Notificaciones (3)
                            </h6>
                        </li>
                        <li>
                            <a class="dropdown-item notification-item" href="#">Nuevo mensaje recibido</a>
                        </li>
                        <li>
                            <a class="dropdown-item notification-item" href="#">Actualización del sistema</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider" />
                        </li>
                        <li>
                            <a class="dropdown-item notification-view-all" href="#">Ver todas</a>
                        </li>
                    </ul>
                </div>

                <!-- Perfil -->
                <div class="dropdown profile-dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center p-2" href="#" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar-circle me-2">
                            <i class="fas fa-user-alt"></i>
                        </div>
                        <span class="d-none d-lg-inline username">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end profile-menu">
                        <li>
                            <a class="dropdown-item" routerLink="/perfil">
                                <i class="far fa-user me-2"></i> Perfil</a>
                        </li>
                        <li>
                            <a class="dropdown-item" routerLink="/dashboard-perfil/configuracion-perfil">
                                <i class="fas fa-lock me-2"></i> Seguridad</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider" />
                        </li>
                        <li>
                            <a class="dropdown-item cerrar-sesion" (click)="logout()">
                                <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
