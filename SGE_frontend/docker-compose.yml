services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sge-frontend:latest
    container_name: sge-frontend
    restart: unless-stopped
    # Sin "ports": no se publica nada en el host.
    # El proxy (Nginx Proxy Manager) alcanza el contenedor por la red interna
    # apuntando a  http://sge-frontend:8010  (ver nginx.conf)
    expose:
      - "8010"
    networks:
      - npm-network
    environment:
      TZ: America/Bogota
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm-network:
    external: true
